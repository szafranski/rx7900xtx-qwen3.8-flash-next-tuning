<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1050 638" role="img" aria-labelledby="title desc" font-family="Arial, sans-serif">
<title id="title">ROCm task time by configuration</title><desc id="desc">Seven stacked bars show prompt and generation seconds, plus remaining container memory. At 65k, ubatch 1024 took 186.4 seconds with 2.55 GB free; ubatch 2048 took 167.4 seconds with 0.72 GB free.</desc>
